<!-- SNSシェア用OG画像(1200x630)の元。scripts/make-og.sh でPNG化する -->
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fffaf1;--ink:#39291f;--muted:#756257;--orange:#ef713c;--pink:#ff4472;--yellow:#ffc84a}
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:var(--paper);color:var(--ink);
       font-family:'Zen Maru Gothic',sans-serif;display:grid;grid-template-columns:1fr 470px;align-items:center;
       padding:0 0 0 66px;position:relative}
  body:after{content:'';position:absolute;inset:auto 0 0 0;height:14px;
       background:linear-gradient(90deg,var(--orange),var(--pink),var(--yellow))}
  .pill{display:inline-flex;align-items:center;gap:9px;border:3px solid var(--ink);border-radius:99px;
        background:var(--yellow);box-shadow:4px 5px 0 var(--ink);padding:9px 20px;
        font:900 20px 'M PLUS Rounded 1c'}
  h1{font:900 74px/1.2 'M PLUS Rounded 1c';letter-spacing:-.05em;margin:26px 0 0}
  h1 em{font-style:normal;color:var(--orange);position:relative}
  h1 em:after{content:'';position:absolute;left:0;right:0;bottom:-6px;height:11px;background:var(--yellow);border-radius:50%;z-index:-1}
  .gift{margin-top:30px;border:3px dashed var(--orange);background:#fff7e8;border-radius:18px;
        padding:15px 22px;display:inline-block}
  .gift b{font:900 30px 'M PLUS Rounded 1c';color:var(--pink)}
  .gift small{display:block;margin-top:5px;font-size:16px;color:var(--muted);font-weight:700}
  .brand{margin-top:34px;display:flex;align-items:center;gap:13px}
  .brand img{width:56px;height:56px;border-radius:50%;object-fit:cover}
  .brand b{font:900 30px 'M PLUS Rounded 1c'}
  .brand span{font-size:16px;color:var(--muted);border-left:2px solid #d9c9b9;padding-left:13px;font-weight:700}
  .art{height:630px;display:flex;align-items:flex-end;justify-content:center}
  .art img{width:520px;margin-right:-40px}
</style>
<body>
  <div>
    <span class="pill">🎁 応募者全員・費用0円</span>
    <h1>家族の「今」を、<br><em>作品として残す。</em></h1>
    <div class="gift">
      <b>4つから好きな1つ〈無料〉</b>
      <small>イラスト・ミニ絵本・ミニ漫画・LINEスタンプ8個</small>
    </div>
    <div class="brand">
      <img src="http://127.0.0.1:5173/img/okan-logo.webp" alt="">
      <b>オカン。</b><span>家族の思い出作品室</span>
    </div>
  </div>
  <div class="art"><img src="http://127.0.0.1:5173/img/okan-family.webp" alt=""></div>
</body>
